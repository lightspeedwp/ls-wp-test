# Lefthook configuration for this skill's own repository.
# For the template to copy into a project under test, see
# references/lefthook-consumer-template.yml.
# Install: npm install && npx lefthook install

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm test
    validators:
      run: npm run test:validators
